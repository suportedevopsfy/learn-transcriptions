name: golden-path

on:
  workflow_call:
    inputs:
      image:
        required: true
        type: string
      context:
        required: false
        type: string
        default: .
      fail_on:
        required: false
        type: string
        default: CRITICAL

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  build-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          push: false
          load: true
          tags: ghcr.io/${{ github.repository }}/${{ inputs.image }}:${{ github.sha }}
      - name: trivy sarif
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}/${{ inputs.image }}:${{ github.sha }}
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
          category: trivy-image
      - name: trivy gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}/${{ inputs.image }}:${{ github.sha }}
          format: table
          severity: ${{ inputs.fail_on }}
          ignore-unfixed: true
          exit-code: '1'
      - name: push
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          push: true
          tags: ghcr.io/${{ github.repository }}/${{ inputs.image }}:${{ github.sha }}
