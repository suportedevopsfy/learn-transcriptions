# BoxOps.Phase2.Ag99Lc — Fase 2 bundle load (HPSA + HPSD container images).
# Local-only, sem túnel. Assume os tars já estão hidratados em um bundle dir.
# Roadblock: se faltar algum tar, que passo reporte MISSING mas continue (não aborta job).
name: BoxOps.Phase2.Ag99Lc

trigger: none
pr: none

pool:
  name: PlatformAg99Lc

variables:
  # Path REAL confirmado por probe 3801 (2026-07-15): library de time "Engenharia TLF"
  # sincronizada como atalho no OneDrive - Accenture do perfil "David Vidal Buena".
  # Apontar direto pra pasta VIVO evita varrer AppData (lento + falsos-positivos .bundle.js).
  # Fallback: se find não achar aqui, cai pra pasta do usuário inteira.
  BUNDLE_BASE: "/mnt/c/Users/David Vidal Buena/OneDrive - Accenture/Engenharia TLF - HPSD - Transição e Takeover/07 - Treinamento/01 - VIVO"
  BUNDLE_FALLBACK: "/mnt/c/Users/David Vidal Buena"

jobs:
  - job: Phase2BundleLoad
    timeoutInMinutes: 60
    steps:
      - checkout: none
      - bash: |
          set +e
          echo "===PHASE 2: Bundle Load==="
          echo "BUNDLE_BASE: $(BUNDLE_BASE)"
          echo "BUNDLE_FALLBACK: $(BUNDLE_FALLBACK)"

          # find_bundle <nome> : procura no BASE, senão no FALLBACK. Ecoa o path (ou vazio).
          find_bundle() {
            local nome="$1" hit
            hit=$(find "$(BUNDLE_BASE)" -name "$nome" -type f 2>/dev/null | head -1)
            [ -z "$hit" ] && hit=$(find "$(BUNDLE_FALLBACK)" -name "$nome" -type f 2>/dev/null | head -1)
            echo "$hit"
          }

          # hydrated <path> : 0 (ok) se o arquivo tem blocos REAIS em disco (não é placeholder OneDrive).
          # stat -c%s mente (mostra tamanho LÓGICO mesmo desidratado); du mede blocos reais.
          # Regra: disk_kb precisa ser >= 90% do tamanho lógico p/ considerar hidratado.
          hydrated() {
            local f="$1" logical_kb disk_kb
            [ -f "$f" ] || return 1
            logical_kb=$(( $(stat -c %s "$f" 2>/dev/null || echo 0) / 1024 ))
            disk_kb=$(du -k "$f" 2>/dev/null | cut -f1)
            disk_kb=${disk_kb:-0}
            echo "    hidratação: disk_kb=$disk_kb logical_kb=$logical_kb"
            [ "$logical_kb" -gt 0 ] && [ "$disk_kb" -ge $(( logical_kb * 9 / 10 )) ]
          }

          # Criar dirs de trabalho
          mkdir -p ~/part1 ~/part2-hpsd

          echo ""
          echo "===HPSA: Procurar + checar hidratação dos tars==="
          EXPECTED_ORACLEXE=5926330368
          EXPECTED_SA1_2=3412847104
          DEHYDRATED=0

          HPSA_ORACLEXE=$(find_bundle "oraclexe.tar")
          HPSA_SA1_2=$(find_bundle "sa1_2.tar")

          if [ -n "$HPSA_ORACLEXE" ]; then
            echo "oraclexe.tar encontrado: $HPSA_ORACLEXE"
            if hydrated "$HPSA_ORACLEXE"; then
              echo "  ✓ hidratado"
            else
              echo "  ❌ DESIDRATADO (placeholder OneDrive) — hidrate no host: botão direito → 'Sempre manter neste dispositivo'"
              DEHYDRATED=1
            fi
          else
            echo "❌ MISSING: oraclexe.tar não encontrado"; DEHYDRATED=1
          fi

          if [ -n "$HPSA_SA1_2" ]; then
            echo "sa1_2.tar encontrado: $HPSA_SA1_2"
            if hydrated "$HPSA_SA1_2"; then
              echo "  ✓ hidratado"
            else
              echo "  ❌ DESIDRATADO (placeholder OneDrive) — hidrate no host"
              DEHYDRATED=1
            fi
          else
            echo "❌ MISSING: sa1_2.tar não encontrado"; DEHYDRATED=1
          fi

          echo ""
          echo "===HPSA: Copiar tars (só se hidratados)==="
          if [ "$DEHYDRATED" -eq 1 ]; then
            echo "⏭️  PULANDO cópia/load HPSA — arquivo(s) não hidratado(s). Nada de tar de 0 byte."
          else
            echo "Copiando oraclexe.tar para ~/part1/ ..."
            cp "$HPSA_ORACLEXE" ~/part1/ || echo "FALHA ao copiar oraclexe.tar"
            echo "Copiando sa1_2.tar para ~/part1/ ..."
            cp "$HPSA_SA1_2" ~/part1/ || echo "FALHA ao copiar sa1_2.tar"
          fi

          echo ""
          echo "===HPSA: Validar cópia==="
          cd ~/part1
          if [ -f oraclexe.tar ]; then
            COPY_SIZE=$(stat -c %s oraclexe.tar 2>/dev/null || echo "0")
            echo "oraclexe.tar copiado: $COPY_SIZE bytes"
            if [ "$COPY_SIZE" -lt "$EXPECTED_ORACLEXE" ]; then
              echo "⚠️  Cópia baixa — arquivo pode estar ainda desidratado"
            fi
          fi
          if [ -f sa1_2.tar ]; then
            COPY_SIZE=$(stat -c %s sa1_2.tar 2>/dev/null || echo "0")
            echo "sa1_2.tar copiado: $COPY_SIZE bytes"
          fi

          echo ""
          echo "===HPSA: Carregar imagens==="
          if [ -f oraclexe.tar ]; then
            echo "podman load -i oraclexe.tar ..."
            podman load -i oraclexe.tar 2>&1 | tail -5 || echo "⚠️  podman load oraclexe.tar falhou"
          else
            echo "❌ SKIP: oraclexe.tar não encontrado após cópia"
          fi

          if [ -f sa1_2.tar ]; then
            echo "podman load -i sa1_2.tar ..."
            podman load -i sa1_2.tar 2>&1 | tail -5 || echo "⚠️  podman load sa1_2.tar falhou"
          else
            echo "❌ SKIP: sa1_2.tar não encontrado após cópia"
          fi

          echo ""
          echo "===HPSD: Procurar + checar hidratação do docker1.zip==="
          EXPECTED_ZIP=6549154678  # 6.55 GB — tamanho REAL confirmado por probe 3801
          HPSD_DEHYDRATED=0

          HPSD_ZIP=$(find_bundle "docker1.zip")

          if [ -n "$HPSD_ZIP" ]; then
            echo "docker1.zip encontrado: $HPSD_ZIP"
            if hydrated "$HPSD_ZIP"; then
              echo "  ✓ hidratado"
            else
              echo "  ❌ DESIDRATADO (placeholder OneDrive) — hidrate no host"
              HPSD_DEHYDRATED=1
            fi
          else
            echo "❌ MISSING: docker1.zip não encontrado"; HPSD_DEHYDRATED=1
          fi

          echo ""
          echo "===HPSD: Descompactar e carregar (só se hidratado)==="
          cd ~/part2-hpsd
          if [ -n "$HPSD_ZIP" ] && [ "$HPSD_DEHYDRATED" -eq 0 ]; then
            echo "Copiando docker1.zip ..."
            cp "$HPSD_ZIP" . || { echo "FALHA ao copiar docker1.zip"; }
            echo "Descompactando docker1.zip ..."
            unzip -q docker1.zip 2>&1 | tail -3 || { echo "⚠️  unzip falhou"; }

            if [ -f docker/all_images_sd1.tar ]; then
              SIZE_TARSD=$(stat -c %s docker/all_images_sd1.tar 2>/dev/null || echo "0")
              echo "all_images_sd1.tar extraído: $SIZE_TARSD bytes"
              echo "Carregando all_images_sd1.tar (pode levar 5+ min) ..."
              podman load -i docker/all_images_sd1.tar 2>&1 | tail -5 || echo "⚠️  podman load all_images_sd1.tar falhou"
            else
              echo "❌ MISSING: docker/all_images_sd1.tar dentro do zip"
            fi
          else
            echo "❌ SKIP: docker1.zip não encontrado"
          fi

          echo ""
          echo "===Imagens carregadas no podman==="
          podman images || true

          echo ""
          echo "===Resumo de volumes==="
          echo "Part1 (HPSA):"
          ls -lh ~/part1/ 2>/dev/null | head -10 || echo "  (não existe ou vazio)"
          echo ""
          echo "Part2-HPSD:"
          ls -lh ~/part2-hpsd/ 2>/dev/null | head -10 || echo "  (não existe ou vazio)"
          ls -lh ~/part2-hpsd/docker/ 2>/dev/null | head -10 || echo "  (não existe ou vazio)"

          echo ""
          echo "===END PHASE 2==="
        displayName: "Fase 2: Bundle load (podman load)"
