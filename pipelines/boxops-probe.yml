# BoxOps.Probe.Ag99Lc — smoke test de root sem senha (pos-NOPASSWD).
# Prova root real: whoami, escreve/le em /root (so-root), e checa dnf. Limpa no fim.
name: BoxOps.Probe.Ag99Lc

trigger: none
pr: none

pool:
  name: PlatformAg99Lc

jobs:
  - job: RootSmoke
    timeoutInMinutes: 10
    steps:
      - checkout: none
      - bash: |
          set +e
          echo "===WHOAMI==="
          echo "user normal: $(whoami)"
          echo "via sudo -n: $(sudo -n whoami 2>&1)"
          echo "id via sudo: $(sudo -n id 2>&1)"

          echo "===ROOT_WRITE (/root e so-root)==="
          sudo -n bash -c 'echo "boxops root proof $(date -u +%FT%TZ)" > /root/boxops-proof.txt && cat /root/boxops-proof.txt'
          echo "exit=$?"

          echo "===DNF==="
          command -v dnf && sudo -n dnf --version 2>&1 | head -2

          echo "===CLEANUP==="
          sudo -n rm -f /root/boxops-proof.txt && echo "removido"

          echo "===END==="
        displayName: "Root smoke test (NOPASSWD)"
