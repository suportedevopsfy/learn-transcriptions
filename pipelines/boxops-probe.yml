# BoxOps.Probe.Ag99Lc — probe de PERSISTÊNCIA do agente (read-only).
# Confirma: serviço systemd do agente existe/enabled? .vbs de autostart já na Startup?
# nome real da distro? Sem sudo, sem escrever nada.
name: BoxOps.Probe.Ag99Lc

trigger: none
pr: none

pool:
  name: PlatformAg99Lc

jobs:
  - job: PersistProbe
    timeoutInMinutes: 10
    steps:
      - checkout: none
      - bash: |
          set +e
          echo "===AGENT_SERVICE==="
          # unit de sistema instalada pelo svc.sh
          ls -la /etc/systemd/system/ 2>/dev/null | grep -i 'vsts\|agent' || echo "(nenhuma unit vsts.agent em /etc/systemd/system)"
          systemctl status 'vsts.agent.*' --no-pager 2>&1 | head -15
          echo "-- is-enabled:"
          for u in $(systemctl list-unit-files 2>/dev/null | grep -io 'vsts.agent[^ ]*' | sort -u); do
            printf "%s: " "$u"; systemctl is-enabled "$u" 2>&1
          done

          echo "===SYSTEMD==="
          systemctl is-system-running 2>&1
          cat /etc/wsl.conf 2>&1 || echo "(sem /etc/wsl.conf)"

          echo "===DISTRO_NAME (best-effort de dentro da WSL)==="
          echo "WSL_DISTRO_NAME=$WSL_DISTRO_NAME"
          cat /etc/resolv.conf 2>/dev/null | head -2

          echo "===STARTUP_FOLDER (Windows)==="
          S="/mnt/c/Users/David Vidal Buena/AppData/Roaming/Microsoft/Windows/Start Menu/Programs/Startup"
          echo "path: $S"
          ls -la "$S" 2>&1

          echo "===EXISTING_VBS==="
          find "/mnt/c/Users/David Vidal Buena" -maxdepth 6 -iname '*.vbs' 2>/dev/null | head -20

          echo "===END==="
        displayName: "Persistence probe (agent service + autostart, read-only)"
