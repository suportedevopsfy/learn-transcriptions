# BoxOps.HpsdForward.Ag99Lc — force-clean (via manager) + subida EM ESTAGIOS com o mv do crash-loop
# do sdsp (logica do vendor up-podman.sh). Tudo sob o systemd --user persistente → forwarders sobrevivem.
# Estagios: Oracle healthy → sdsp + `podman exec mv 01_wait_for_db.sh` enquanto roda → resto do stack.
name: BoxOps.HpsdForward.Ag99Lc

trigger: none
pr: none

pool:
  name: PlatformAg99Lc

jobs:
  - job: HpsdForward
    timeoutInMinutes: 12
    steps:
      - checkout: none
      - bash: |
          set +e
          UID_N=$(id -u); export XDG_RUNTIME_DIR=/run/user/$UID_N
          export DBUS_SESSION_BUS_ADDRESS=unix:path=$XDG_RUNTIME_DIR/bus
          export PATH="$HOME/.local/bin:/usr/local/bin:/usr/bin:/bin:$PATH"
          echo "===HPSD FORWARD (nuke + staged up)  $(date -u +%H:%M:%SZ)==="
          mkdir -p ~/part2-hpsd/docker ~/.config/systemd/user

          # ---------- hpsd-ctl.sh (nuke + staged up) ----------
          cat > ~/part2-hpsd/docker/hpsd-ctl.sh <<'CTL'
          #!/usr/bin/env bash
          set +e
          export PATH="$HOME/.local/bin:/usr/local/bin:/usr/bin:/bin:$PATH"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          DIR=~/part2-hpsd/docker; cd "$DIR" || exit 1
          . ./env.sh rhel 2>/dev/null
          sel() { podman ps -a --format '{{.Names}}' | grep -iE 'sddb_vivo|sdsp_vivo|^tools$|^sdui$|sdui-plugin|omuiplugin_vivo|museomui_vivo|muse-(auth|registry|config|notif|shell|gateway)_vivo'; }
          case "$1" in
            nuke)
              # remove o(s) pod(s) que contem containers HPSD, a forca (volume oradata preservado)
              for c in $(sel); do
                pid=$(podman inspect "$c" --format '{{.Pod}}' 2>/dev/null)
                [ -n "$pid" ] && echo "$pid"
              done | sort -u | while read -r p; do echo "  pod rm -f $p"; podman pod rm -f "$p" 2>&1; done
              L=$(sel); [ -n "$L" ] && { echo "  rm -f leftover: $L"; podman rm -f $L 2>&1; }
              ;;
            up)
              echo "[stage1] Oracle (sddb_vivo)"
              podman compose up -d sddb_vivo 2>&1 | tail -3
              for i in $(seq 1 42); do
                podman logs sddb_vivo 2>&1 | grep -q 'DATABASE IS READY TO USE' && { echo "  Oracle READY"; break; }
                sleep 10
              done
              echo "[stage2] sdsp_vivo + mv do crash-loop"
              podman compose up -d sdsp_vivo 2>&1 | tail -3
              for i in $(seq 1 15); do
                if podman ps --format '{{.Names}}' | grep -q '^sdsp_vivo$'; then
                  podman exec sdsp_vivo mv /docker/scripts/startup/01_wait_for_db.sh / 2>/dev/null \
                    && { echo "  01_wait_for_db.sh movido (crash-loop neutralizado)"; break; }
                fi
                sleep 5
              done
              echo "[stage3] resto do stack"
              podman compose up -d 2>&1 | tail -5
              ;;
            stop)  podman compose stop 2>&1 ;;
            list)  sel ;;
            *)     echo "uso: hpsd-ctl.sh {nuke|up|stop|list}" ;;
          esac
          CTL
          chmod +x ~/part2-hpsd/docker/hpsd-ctl.sh

          # ---------- unit ----------
          cat > ~/.config/systemd/user/hpsd.service <<UNIT
          [Unit]
          Description=HPSD stack (podman rootless, forwarders sob o user manager)
          After=default.target

          [Service]
          Type=oneshot
          RemainAfterExit=yes
          ExecStart=%h/part2-hpsd/docker/hpsd-ctl.sh up
          ExecStop=%h/part2-hpsd/docker/hpsd-ctl.sh stop
          TimeoutStartSec=1800

          [Install]
          WantedBy=default.target
          UNIT

          echo "-- limpa estado da unit:"
          systemctl --user stop hpsd.service 2>&1
          systemctl --user reset-failed hpsd.service 2>&1
          systemctl --user daemon-reload 2>&1

          echo ""
          echo "-- NUKE do pod HPSD via manager (namespace certo, force):"
          systemd-run --user --pipe --wait --collect --unit=hpsd-nuke "$HOME/part2-hpsd/docker/hpsd-ctl.sh" nuke 2>&1 | tail -20

          echo ""
          echo "-- estado pos-nuke (so part1_* do HPSA devem sobrar):"
          podman ps -a --format 'table {{.Names}}\t{{.Status}}' 2>&1 | grep -iE 'NAMES|sddb|sdsp|muse|omui|sdui|gateway|^tools' | head -20
          echo "-- volume oradata:"; podman volume ls 2>&1 | grep -i oradata

          echo ""
          echo "-- enable + start --no-block (staged up roda ~15min sob o manager):"
          systemctl --user enable hpsd.service 2>&1
          systemctl --user --no-block start hpsd.service 2>&1
          echo "   start rc=$?"
          sleep 8
          systemctl --user is-active hpsd.service 2>&1
          echo "===END==="
        displayName: "HPSD nuke + staged up"
